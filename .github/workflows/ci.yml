name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"          # nightly forked harness, an hour after nutz-contracts'

# Three tiers, and the split between them is deliberate. `go` needs nothing but a toolchain,
# so it runs anywhere. `harness` needs foundry and a built nutz-contracts but no secrets, so
# it runs on every push — that is the tier that keeps ADR-0004's bargain, because a decoder
# regression must not be able to sit unnoticed until the next nightly. `fork` needs an archive
# endpoint, so it is nightly, and it is the only tier that can answer what chain 4663 itself
# serves.

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # go.mod's directive, not the newest release: spec §3 wants a conservative version so a
      # distro toolchain builds the Verifier, and that claim is worth failing on.
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go build ./...
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      # The anvil harness self-skips here: no foundry, no sibling checkout, and neither
      # NUTZ_VERIFY_REQUIRE_* set. The `harness` job is where it is required to run.
      - run: go test -race ./...

      # ADR-0004 makes go.sum a user-facing artifact — "the dependency tree is part of the
      # product" — so the tree is a gate rather than a convention. x/sys arrives only as
      # x/crypto's own requirement; anything else here is an ADR-level decision that has been
      # taken by accident.
      - name: the dependency tree is still what ADR-0004 allows
        run: |
          actual=$(go list -deps ./... | grep -E '^[a-z0-9.-]+\.[a-z]{2,}/' | grep -v nutzwtf/nutz-verify | sort -u)
          expected=$'golang.org/x/crypto/sha3\ngolang.org/x/sys/cpu'
          if [ "$actual" != "$expected" ]; then
            echo "::error::the built dependency tree changed; see docs/adr/0004-stdlib-only-no-geth.md"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  harness:
    name: harness (bare node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The harness decodes what the real Distributor emits, so it needs that repo's compiled
      # artifacts. Checked out inside the workspace because actions/checkout refuses paths
      # outside it; NUTZ_CONTRACTS points the harness at it.
      - uses: actions/checkout@v4
        with:
          repository: nutzwtf/nutz-contracts
          path: nutz-contracts
          submodules: recursive
          token: ${{ secrets.CONTRACTS_TOKEN || github.token }}
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.8.1 }       # pinned to nutz-contracts' .mise.toml and its own CI
      - run: forge build
        working-directory: nutz-contracts
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: every decoder against a real node
        env:
          NUTZ_VERIFY_REQUIRE_ANVIL: "1"
          NUTZ_CONTRACTS: ${{ github.workspace }}/nutz-contracts
        run: go test -count=1 -v -timeout 900s -run TestAnvil ./internal/chain/

  fork:
    name: harness (fork of 4663)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nutzwtf/nutz-contracts
          path: nutz-contracts
          submodules: recursive
          token: ${{ secrets.CONTRACTS_TOKEN || github.token }}
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.8.1 }
      - run: forge build
        working-directory: nutz-contracts
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      # No `if: env.RPC_4663 != ''` guard, deliberately: this job exists to answer what chain
      # 4663 serves, and a nightly that green-skips because a secret is missing is the same
      # silent non-check NUTZ_VERIFY_REQUIRE_FORK was added to stop. Red until RPC_4663 is set.
      - name: every decoder against a fork of 4663
        env:
          NUTZ_VERIFY_REQUIRE_ANVIL: "1"
          NUTZ_VERIFY_REQUIRE_FORK: "1"
          NUTZ_CONTRACTS: ${{ github.workspace }}/nutz-contracts
          RPC_4663: ${{ secrets.RPC_4663 }}
        run: go test -count=1 -v -timeout 900s -run TestAnvil ./internal/chain/
