name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"          # nightly forked harness, an hour after nutz-contracts'

# Three tiers, and the split between them is deliberate.
#
#   go       nothing but a toolchain, so it runs anywhere.
#   harness  foundry and a built nutz-contracts, forking chain 4663 through its public
#            endpoint. No secret: that endpoint needs no key, which is the same fact ADR-0002
#            rests on — a hostile stranger downloads the binary and runs it. So the tier that
#            keeps ADR-0004's bargain runs on every push, and a decoder regression cannot sit
#            unnoticed until the next nightly.
#   live     reads real 4663 history and cross-checks two independent providers, which is the
#            only place ADR-0002's "two providers are not colluding" is actually tested. It
#            queries someone else's public endpoint, so it is nightly rather than per-push.
#
# PUBLIC_4663 is the chain's own public RPC, pinned here as a plain value because it is not a
# secret and a CI that needed one would contradict the claim the Verifier makes.
env:
  PUBLIC_4663: https://rpc.mainnet.chain.robinhood.com

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # go.mod, not the newest release. Its `toolchain` line is what releases are built with
      # (scripts/build-release.sh pins it), a supported, patched version; its `go` line stays
      # the conservative minimum spec §3 wants so a distro toolchain builds the Verifier.
      # setup-go installs the toolchain line, so this job tests the release toolchain.
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go build ./...
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      # ...and the `go` line is still an honest minimum: the same source built by exactly
      # that version, which the Go command downloads. Only the release is pinned to the
      # toolchain line; a distro Go this old still builds the Verifier.
      - name: the go line's version builds it too
        run: |
          export GOTOOLCHAIN=go$(awk '/^go /{print $2}' go.mod)
          go version
          go build ./... && go vet ./...
      # The anvil harness self-skips here: no foundry, no sibling checkout, and neither
      # NUTZ_VERIFY_REQUIRE_* set. The `harness` job is where it is required to run.
      - run: go test -race ./...

      # ADR-0004 makes go.sum a user-facing artifact — "the dependency tree is part of the
      # product" — so the tree is a gate rather than a convention. x/sys arrives only as
      # x/crypto's own requirement; anything else here is an ADR-level decision that has been
      # taken by accident.
      - name: the dependency tree is still what ADR-0004 allows
        run: |
          actual=$(go list -deps ./... | grep -E '^[a-z0-9.-]+\.[a-z]{2,}/' | grep -v nutzwtf/nutz-verify | sort -u)
          expected=$'golang.org/x/crypto/sha3\ngolang.org/x/sys/cpu'
          if [ "$actual" != "$expected" ]; then
            echo "::error::the built dependency tree changed; see docs/adr/0004-stdlib-only-no-geth.md"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  release-build:
    name: every target builds cgo-free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      # The release recipe on every push: CGO_ENABLED=0, all four targets, the settings
      # read back from each binary. A package that quietly needs cgo, or a change that
      # drops -trimpath, fails here rather than at the tag. Reproducibility across two
      # machines is asserted in release.yml, where it gates publishing.
      - run: scripts/build-release.sh dist

  harness:
    name: harness (fork of 4663)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The harness decodes what the real Distributor emits, so it needs that repo's compiled
      # artifacts. Checked out inside the workspace because actions/checkout refuses paths
      # outside it; NUTZ_CONTRACTS points the harness at it. nutz-contracts is public, so
      # the default token reads it; no secret is needed anywhere in this job.
      - uses: actions/checkout@v4
        with:
          repository: nutzwtf/nutz-contracts
          path: nutz-contracts
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.8.1 }       # pinned to nutz-contracts' .mise.toml and its own CI
      - run: forge build
        working-directory: nutz-contracts
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      # Both REQUIRE_* set: no secret is needed to fork 4663, so there is no reason to let
      # this degrade to a bare node or to skip.
      - name: every decoder against a fork of 4663
        env:
          NUTZ_VERIFY_REQUIRE_ANVIL: "1"
          NUTZ_VERIFY_REQUIRE_FORK: "1"
          NUTZ_VERIFY_FORK_RPC: ${{ env.PUBLIC_4663 }}
          NUTZ_CONTRACTS: ${{ github.workspace }}/nutz-contracts
        run: go test -count=1 -v -timeout 900s -run TestAnvil ./internal/chain/

  live:
    name: live (real 4663, two providers)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      # RPC_4663 is a Chainstack archive endpoint. Without it this still exercises the paging
      # against the public endpoint's real 10,000-result cap; with it, the two are compared
      # byte for byte, which is the only test ADR-0002's cross-check has that is not one node
      # compared with itself.
      - name: paging and cross-check against real history
        env:
          NUTZ_VERIFY_LIVE_RPC: ${{ env.PUBLIC_4663 }}
          NUTZ_VERIFY_LIVE_RPC_2: ${{ secrets.RPC_4663 }}
        run: go test -count=1 -v -timeout 600s -run TestLive ./internal/chain/
      # The load test: a slice of USDG history synced into a throwaway Cache through the real
      # Reader, printing blocks per second and what that extrapolates to. Spec §9 records the
      # numbers; this is where they come from, and where a regression in the sync rate shows.
      - name: sync a slice of USDG history
        env:
          NUTZ_VERIFY_LIVE_RPC: ${{ env.PUBLIC_4663 }}
        run: go test -count=1 -v -timeout 900s -run TestLive ./internal/cache/
